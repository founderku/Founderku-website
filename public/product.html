<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder Starterpack · Founderku</title>
<meta name="description" content="Detail produk Founder Starterpack dari Founderku.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0;padding-top:clamp(28px,4vw,56px)">
    <nav class="crumb" id="crumb" aria-label="Breadcrumb"><a href="/store.html" data-t="store"></a></nav>
    <div class="detail" id="detail" hidden>
      <div>
        <div class="gal" id="gal"></div>
        <div class="thumbs" id="thumbs"></div>
        <div class="blk"><h2 data-t="why"></h2><div id="desc"></div></div>
        <div class="blk" id="featBlk"><h2 data-t="get"></h2><ul class="ticks two-col" id="feats"></ul></div>
      </div>
      <aside class="buy">
        <div class="cat" id="bCat"></div>
        <h1 id="bTitle"></h1>
        <p id="bDesc"></p>
        <div class="price" style="font-size:40px"><small data-t="from"></small><span id="bPrice"></span></div>
        <a class="btn btn-solid" id="bOrder" href="#" target="_blank" rel="noopener" data-t="order"></a>
        <a class="btn btn-line" id="bVisit" href="#" target="_blank" rel="noopener" hidden data-t="visit"></a>
        <div class="hint"><i>i</i><span data-t="hint"></span></div>
      </aside>
    </div>
    <div class="state" id="nf" hidden><span data-t="nf"></span> <a href="/store.html" data-t="nfLink"></a></div>
  </section>

  <section class="band rv" id="moreBand" hidden>
    <div class="row-head"><span data-t="more"></span><a class="btn btn-line btn-sm" href="/store.html" data-t="all"></a></div>
    <div class="sp-grid" id="more"></div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  var CAT={id:{'landing-page':'Landing page','company-profile':'Company profile','portfolio':'Portfolio','platform-marketplace':'Platform & marketplace'},en:{'landing-page':'Landing page','company-profile':'Company profile','portfolio':'Portfolio','platform-marketplace':'Platform & marketplace'},tr:{'landing-page':'Açılış sayfası','company-profile':'Şirket profili','portfolio':'Portfolyo','platform-marketplace':'Platform & pazar yeri'}};
  function catLabel(p){var c=(CAT[FK.lang]||CAT.id)[p.category||''];return c||p.categoryLabel||p.category||'';}
  function pname(p){return FK.pick(p.name).split(' - ')[0];}
  function spCard(p,get){
    var thumb=p.thumbnail&&p.thumbnail.indexOf('placeholder')<0?'<img src="'+FK.esc(FK.safeUrl(p.thumbnail))+'" alt="" loading="lazy">':'<span class="soon">'+FK.esc(get('soon'))+'</span>';
    return '<a class="sp rv" href="/product.html?slug='+encodeURIComponent(p.slug)+'"><span class="ph">'+thumb+'<span class="badge">'+FK.esc(catLabel(p))+'</span></span>'+
      '<span class="tx"><b>'+FK.esc(pname(p))+'</b><span class="ds">'+FK.esc(FK.pick(p.shortDescription))+'</span>'+
      '<span class="row"><span class="pr"><small>'+FK.esc(get('from'))+'</small>'+FK.esc(FK.price(p))+'</span><span class="go">'+FK.esc(get('detail'))+'</span></span></span></a>';
  }
  var DICT={
    id:{store:'Starterpack',why:'Kenapa produk ini',get:'Yang kamu dapat',from:'Mulai dari',order:'Pesan dan mulai sekarang',visit:'Lihat website contoh',hint:'Klik pesan, kamu diarahkan ke WhatsApp untuk ngobrol soal rebranding dan setup. Konsultasinya gratis.',nf:'Produk ini belum ada atau sudah dipindah.',nfLink:'Balik ke Starterpack',more:'Produk lain yang siap jalan',all:'Lihat semua',soon:'Segera hadir',detail:'Lihat detail',noImg:'Gambar belum tersedia',photo:'Foto',waMsg:'Halo Founderku, aku mau pesan {name}'},
    en:{store:'Starterpack',why:'Why this product',get:'What you get',from:'From',order:'Order and get started',visit:'See the live example',hint:'Tap order and you will go to WhatsApp to talk about rebranding and setup. The consultation is free.',nf:'This product does not exist or has moved.',nfLink:'Back to Starterpack',more:'Other ready-to-run products',all:'See all',soon:'Coming soon',detail:'See details',noImg:'No image yet',photo:'Photo',waMsg:'Hi Founderku, I would like to order {name}'},
    tr:{store:'Starterpack',why:'Neden bu ürün',get:'Neler alırsın',from:'Başlangıç',order:'Sipariş ver ve başla',visit:'Canlı örneği gör',hint:'Sipariş\'e dokununca yeniden markalama ve kurulum için WhatsApp\'a yönlendirilirsin. Danışmanlık ücretsiz.',nf:'Bu ürün yok ya da taşındı.',nfLink:'Starterpack\'e dön',more:'Çalışmaya hazır diğer ürünler',all:'Tümünü gör',soon:'Yakında',detail:'Detayları gör',noImg:'Henüz görsel yok',photo:'Fotoğraf',waMsg:'Merhaba Founderku, {name} sipariş etmek istiyorum'}
  };
  var slug=new URLSearchParams(location.search).get('slug'),p=null,all=[],nf=false,gi=0;
  function render(){
    var get=FK.apply(DICT);
    var crumb=document.getElementById('crumb');
    if(nf||!p){
      if(nf){document.getElementById('nf').hidden=false;crumb.innerHTML='<a href="/store.html">'+FK.esc(get('store'))+'</a>';}
      return;
    }
    document.title=pname(p)+' · Founderku';
    crumb.innerHTML='<a href="/store.html">'+FK.esc(get('store'))+'</a><span aria-hidden="true">/</span><span>'+FK.esc(catLabel(p))+'</span><span aria-hidden="true">/</span><span style="color:var(--text)">'+FK.esc(pname(p))+'</span>';
    document.getElementById('bCat').textContent=catLabel(p);
    document.getElementById('bTitle').textContent=FK.pick(p.name);
    document.getElementById('bDesc').textContent=FK.pick(p.shortDescription);
    document.getElementById('bPrice').textContent=FK.price(p);
    var msg=FK.pick(p.whatsappMessage)||get('waMsg').replace('{name}',FK.pick(p.name));
    document.getElementById('bOrder').href=FK.wa(msg);
    var v=document.getElementById('bVisit');
    if(p.liveUrl&&/^https?:\/\//i.test(p.liveUrl)){v.href=p.liveUrl;v.hidden=false;}else v.hidden=true;
    // Deskripsi: bagian setelah " - " dijadikan daftar poin
    var txt=FK.pick(p.fullDescription)||FK.pick(p.shortDescription)||'';
    var parts=txt.split(/\s+-\s+/).map(function(s){return s.trim();}).filter(Boolean);
    var desc=document.getElementById('desc');
    desc.innerHTML='<p>'+FK.esc(parts[0]||'')+'</p>'+(parts.length>1?'<ul class="ticks">'+parts.slice(1).map(function(s){return '<li>'+FK.esc(s)+'</li>';}).join('')+'</ul>':'');
    var feats=FK.pickArr(p.featureTags);
    document.getElementById('featBlk').hidden=!feats.length;
    document.getElementById('feats').innerHTML=feats.map(function(f){return '<li>'+FK.esc(f)+'</li>';}).join('');
    var gal=(p.gallery||[]).filter(function(g){return g&&g.indexOf('placeholder')<0;});
    if(!gal.length&&p.thumbnail&&p.thumbnail.indexOf('placeholder')<0) gal=[p.thumbnail];
    var galEl=document.getElementById('gal');
    galEl.innerHTML=gal.length?'<img src="'+FK.esc(FK.safeUrl(gal[gi]||gal[0]))+'" alt="'+FK.esc(pname(p))+'">':FK.esc(get('noImg'));
    var th=document.getElementById('thumbs');
    th.innerHTML=gal.length>1?gal.map(function(g,i){return '<button type="button" data-i="'+i+'" aria-current="'+(i===gi)+'" aria-label="'+FK.esc(get('photo'))+' '+(i+1)+'"><img src="'+FK.esc(FK.safeUrl(g))+'" alt="" loading="lazy"></button>';}).join(''):'';
    [].forEach.call(th.children,function(b){b.addEventListener('click',function(){gi=+b.dataset.i;render();});});
    document.getElementById('detail').hidden=false;
    var others=all.filter(function(x){return x.slug!==p.slug;}).slice(0,3);
    document.getElementById('moreBand').hidden=!others.length;
    document.getElementById('more').innerHTML=others.map(function(x){return spCard(x,get);}).join('');
    FK.reveal();
  }
  FK.onLang(render);
  if(!slug){nf=true;render();}
  else FK.json('/data/products.json').then(function(d){
    all=(d.products||[]).slice().sort(function(a,b){return (a.price||0)-(b.price||0);});
    p=all.filter(function(x){return x.slug===slug;})[0]||null; if(!p) nf=true; render();
  }).catch(function(){nf=true;render();});
})();
</script>
</body>
</html>
