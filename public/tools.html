<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools · Founderku</title>
<meta name="description" content="Tools Founderku untuk UMKM dan founder baru: halaman jualan, invoice, hitung pajak, kontrak, checklist, dan cek kesehatan usaha.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0">
    <div class="hero-top">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 class="h1" data-t="h1" data-dot></h1>
        <div class="hero-btns"><a class="btn btn-solid" id="ctaMain" href="/daftar" data-t="cta1"></a><a class="btn btn-line" href="/harga" data-t="cta2"></a></div>
      </div>
      <p data-t="sub"></p>
    </div>
  </section>

  <section class="band flush">
    <div class="cards" id="grid"><div class="state" data-t="loading"></div></div>
  </section>

  <section class="band rv">
    <div class="cta-row">
      <div><h2 class="h2" data-t="proH" data-dot></h2><p id="proP"></p></div>
      <div class="hero-btns" style="margin-top:0"><a class="btn btn-solid" href="/harga" data-t="proBtn"></a></div>
    </div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  var DICT={
    id:{title:'Tools · Founderku',eyebrow:'Founderku Tools',h1:'Tools yang bikin usahamu lebih gampang.',sub:'Kami bangun dan pakai sendiri. Semuanya bisa langsung dicoba tanpa daftar. Dengan Founderku Pro, datamu tersimpan di akun dan bisa dibuka dari HP mana pun.',cta1:'Coba gratis {days} hari',cta1In:'Buka akun kamu',cta2:'Lihat harga',loading:'Memuat tools...',empty:'Belum ada tools.',error:'Gagal memuat tools. Coba muat ulang halaman.',go:'Coba sekarang',proH:'Satu akun untuk semua tools.',proP:'Founderku Pro mulai {price}. Trial {days} hari otomatis saat daftar, tanpa kartu dan tanpa tagihan otomatis.',proPx:'Trial {days} hari otomatis saat daftar, tanpa kartu dan tanpa tagihan otomatis.',proBtn:'Lihat harga',month:'bulan'},
    en:{title:'Tools · Founderku',eyebrow:'Founderku Tools',h1:'Tools that make running your business easier.',sub:'We build them and use them ourselves. Try any of them right away, no sign-up. With Founderku Pro, your data is saved to your account and opens on any phone.',cta1:'Try free for {days} days',cta1In:'Open your account',cta2:'See pricing',loading:'Loading tools...',empty:'No tools yet.',error:'Could not load the tools. Try reloading the page.',go:'Try it now',proH:'One account for every tool.',proP:'Founderku Pro starts at {price}. A {days}-day trial starts when you sign up, no card and no automatic billing.',proPx:'A {days}-day trial starts when you sign up, no card and no automatic billing.',proBtn:'See pricing',month:'month'},
    tr:{title:'Araçlar · Founderku',eyebrow:'Founderku Araçları',h1:'İşini kolaylaştıran araçlar.',sub:'Kendimiz geliştirip kullanıyoruz. Hepsini kayıt olmadan hemen deneyebilirsin. Founderku Pro ile verilerin hesabına kaydedilir ve her telefondan açılır.',cta1:'{days} gün ücretsiz dene',cta1In:'Hesabını aç',cta2:'Fiyatları gör',loading:'Araçlar yükleniyor...',empty:'Henüz araç yok.',error:'Araçlar yüklenemedi. Sayfayı yenilemeyi dene.',go:'Hemen dene',proH:'Tüm araçlar için tek hesap.',proP:'Founderku Pro {price} fiyatından başlar. Kaydolunca {days} günlük deneme başlar; kart yok, otomatik ödeme yok.',proPx:'Kaydolunca {days} günlük deneme başlar; kart yok, otomatik ödeme yok.',proBtn:'Fiyatları gör',month:'ay'}
  };
  var tools=null, failed=false, pricing=null, get;
  var grid=document.getElementById('grid');
  function render(){
    get=FK.apply(DICT);
    var cta=document.getElementById('ctaMain');
    if(FK.state.loggedIn){cta.href='/akun';cta.textContent=get('cta1In');}
    var pr=pricing&&pricing.prices&&pricing.prices[0];
    document.getElementById('proP').textContent=pr?get('proP').replace('{price}','Rp '+Math.round(pr.amount).toLocaleString('id-ID')+'/'+get('month')):get('proPx');
    if(failed){grid.innerHTML='<div class="state">'+FK.esc(get('error'))+'</div>';return;}
    if(!tools) return;
    if(!tools.length){grid.innerHTML='<div class="state">'+FK.esc(get('empty'))+'</div>';return;}
    grid.innerHTML=tools.map(function(tl,i){
      var ext=tl.external?' target="_blank" rel="noopener"':'';
      var tags=FK.pickArr(tl.tags).slice(0,3).map(function(x){return '<span>'+FK.esc(x)+'</span>';}).join('');
      return '<a class="cd rv" href="'+FK.esc(FK.toolHref(tl))+'"'+ext+'>'+
        '<div class="top"><span class="orb spin '+FK.orbClass(tl.id,i)+'"><i></i></span><div><h3>'+FK.esc(tl.name)+'</h3><div class="note">'+FK.esc(FK.pick(tl.note))+'</div></div></div>'+
        '<div class="body"><p>'+FK.esc(FK.pick(tl.description))+'</p><div class="tags">'+tags+'</div>'+
        '<div class="foot"><span class="go">'+FK.esc(FK.pick(tl.linkLabel)||get('go'))+'</span></div></div></a>';
    }).join('');
    FK.reveal();
  }
  FK.onLang(render);
  FK.json('/data/tools.json').then(function(d){tools=(d.tools||[]).slice().sort(function(a,b){return (a.order||99)-(b.order||99);});render();}).catch(function(){failed=true;render();});
  FK.json('/data/pricing.json').then(function(d){pricing=d;render();}).catch(function(){});
})();
</script>
</body>
</html>
