<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Founder Starterpack · Founderku</title>
<meta name="description" content="Website dan platform siap jalan, lengkap dengan branding. Pilih, rebrand, dan mulai jualan bareng Founderku.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0">
    <div class="hero-top">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 class="h1" data-t="h1" data-dot></h1>
        <div class="hero-btns"><a class="btn btn-solid" href="#katalog" data-t="cta1"></a><a class="btn btn-line wa-link" href="#" data-t="cta2"></a></div>
      </div>
      <p data-t="sub"></p>
    </div>
  </section>

  <section class="band flush" id="katalog">
    <div class="filters" id="filters" role="group" data-t-aria="filterAria"></div>
    <div class="sp-grid" id="grid"><div class="state" data-t="loading"></div></div>
  </section>

  <section class="band rv">
    <div class="sec-head"><div><div class="eyebrow" data-t="howE"></div><h2 class="h2" data-t="howH" data-dot></h2></div><p data-t="howP"></p></div>
    <div class="steps three" id="how">
      <div class="st"><i>1</i><div><span data-t="s1"></span><small data-t="s1d"></small></div></div>
      <div class="st"><i>2</i><div><span data-t="s2"></span><small data-t="s2d"></small></div></div>
      <div class="st"><i>3</i><div><span data-t="s3"></span><small data-t="s3d"></small></div></div>
    </div>
  </section>
  <section class="band rv">
    <div class="cta-row">
      <div><h2 class="h2" data-t="ctaH" data-dot></h2><p data-t="ctaP"></p></div>
      <div class="hero-btns" style="margin-top:0"><a class="btn btn-solid wa-link" href="#" data-t="ctaBtn"></a></div>
    </div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  var CAT={id:{'landing-page':'Landing page','company-profile':'Company profile','portfolio':'Portfolio','platform-marketplace':'Platform & marketplace'},en:{'landing-page':'Landing page','company-profile':'Company profile','portfolio':'Portfolio','platform-marketplace':'Platform & marketplace'},tr:{'landing-page':'Açılış sayfası','company-profile':'Şirket profili','portfolio':'Portfolyo','platform-marketplace':'Platform & pazar yeri'}};
  function catLabel(p){var c=(CAT[FK.lang]||CAT.id)[p.category||''];return c||p.categoryLabel||p.category||'';}
  function pname(p){return FK.pick(p.name).split(' - ')[0];}
  function spCard(p,get){
    var thumb=p.thumbnail&&p.thumbnail.indexOf('placeholder')<0?'<img src="'+FK.esc(FK.safeUrl(p.thumbnail))+'" alt="" loading="lazy">':'<span class="soon">'+FK.esc(get('soon'))+'</span>';
    return '<a class="sp rv" href="/product.html?slug='+encodeURIComponent(p.slug)+'"><span class="ph">'+thumb+'<span class="badge">'+FK.esc(catLabel(p))+'</span></span>'+
      '<span class="tx"><b>'+FK.esc(pname(p))+'</b><span class="ds">'+FK.esc(FK.pick(p.shortDescription))+'</span>'+
      '<span class="row"><span class="pr"><small>'+FK.esc(get('from'))+'</small>'+FK.esc(FK.price(p))+'</span><span class="go">'+FK.esc(get('detail'))+'</span></span></span></a>';
  }
  var DICT={
    id:{title:'Founder Starterpack · Founderku',eyebrow:'Founder Starterpack',h1:'Produk siap jalan, tinggal kamu pakai.',sub:'Bukan template kosongan. Tiap produk sudah lengkap: brand, warna, sampai cerita produknya. Pilih yang paling nyambung, kami dampingi sampai usahamu beneran online.',cta1:'Lihat katalog',cta2:'Butuh custom?',filterAria:'Filter kategori',all:'Semua',loading:'Memuat katalog...',empty:'Belum ada produk di kategori ini.',error:'Gagal memuat katalog. Coba muat ulang halaman.',soon:'Segera hadir',from:'Mulai dari',detail:'Lihat detail',howE:'Cara kerjanya',howH:'Dari pilih sampai online, kami temani.',howP:'Kamu nggak perlu ngerti teknis. Kita ngobrol dulu, lalu produknya kami sesuaikan dengan nama dan brand kamu.',s1:'Pilih produk',s1d:'Yang paling cocok sama idemu',s2:'Rebrand bareng kami',s2d:'Nama, warna, dan isi disesuaikan',s3:'Online dan jalan',s3d:'Kami bantu sampai siap dipakai',ctaH:'Belum nemu yang pas? Kami bikinin.',ctaP:'Ceritain kebutuhanmu, gratis 30 menit tanpa tekanan.',ctaBtn:'Chat di WhatsApp'},
    en:{title:'Founder Starterpack · Founderku',eyebrow:'Founder Starterpack',h1:'Ready-to-run products, just make them yours.',sub:'Not empty templates. Every product comes complete: brand, colours, and its story. Pick the one that fits, and we will help you until your business is actually live.',cta1:'Browse the catalog',cta2:'Need something custom?',filterAria:'Filter by category',all:'All',loading:'Loading catalog...',empty:'No products in this category yet.',error:'Could not load the catalog. Try reloading the page.',soon:'Coming soon',from:'From',detail:'See details',howE:'How it works',howH:'From choosing to going live, we are with you.',howP:'No technical skills needed. We talk first, then adapt the product to your name and brand.',s1:'Pick a product',s1d:'The one that fits your idea best',s2:'Rebrand with us',s2d:'Name, colours, and content adjusted',s3:'Live and running',s3d:'We help until it is ready to use',ctaH:'Not seeing the right one? We will build it.',ctaP:'Tell us what you need in a free 30-minute chat, no pressure.',ctaBtn:'Chat on WhatsApp'},
    tr:{title:'Founder Starterpack · Founderku',eyebrow:'Founder Starterpack',h1:'Çalışmaya hazır ürünler, sadece sahiplen.',sub:'Boş şablon değil. Her ürün eksiksiz: marka, renkler ve hikayesiyle. Sana uyanı seç, işin gerçekten yayına girene kadar yanındayız.',cta1:'Kataloğa bak',cta2:'Özel bir şey mi lazım?',filterAria:'Kategoriye göre filtrele',all:'Tümü',loading:'Katalog yükleniyor...',empty:'Bu kategoride henüz ürün yok.',error:'Katalog yüklenemedi. Sayfayı yenilemeyi dene.',soon:'Yakında',from:'Başlangıç',detail:'Detayları gör',howE:'Nasıl çalışır',howH:'Seçimden yayına kadar yanındayız.',howP:'Teknik bilgi gerekmez. Önce konuşuruz, sonra ürünü adına ve markana göre uyarlarız.',s1:'Ürünü seç',s1d:'Fikrine en uygun olanı',s2:'Bizimle yeniden markala',s2d:'İsim, renk ve içerik uyarlanır',s3:'Yayında ve çalışıyor',s3d:'Kullanıma hazır olana kadar destek',ctaH:'Uygun olanı bulamadın mı? Biz yapalım.',ctaP:'İhtiyacını ücretsiz 30 dakikalık bir sohbette anlat, baskı yok.',ctaBtn:'WhatsApp\'tan yaz'}
  };
  var products=null,cats=[],active='all',failed=false;
  var grid=document.getElementById('grid'),filters=document.getElementById('filters');
  function render(){
    var get=FK.apply(DICT);
    if(failed){grid.innerHTML='<div class="state">'+FK.esc(get('error'))+'</div>';return;}
    if(!products) return;
    filters.innerHTML=[{id:'all'}].concat(cats).map(function(c){return '<button type="button" data-cat="'+FK.esc(c.id)+'" aria-pressed="'+(active===c.id)+'">'+FK.esc(c.id==='all'?get('all'):catLabel({category:c.id,categoryLabel:c.label}))+'</button>';}).join('');
    [].forEach.call(filters.children,function(b){b.addEventListener('click',function(){active=b.dataset.cat;render();});});
    var list=active==='all'?products:products.filter(function(p){return p.category===active;});
    grid.innerHTML=list.length?list.map(function(p){return spCard(p,get);}).join(''):'<div class="state">'+FK.esc(get('empty'))+'</div>';
    FK.reveal();
  }
  FK.onLang(render);
  FK.json('/data/products.json').then(function(d){
    products=(d.products||[]).slice().sort(function(a,b){return (a.price||0)-(b.price||0);});
    var used={};products.forEach(function(p){used[p.category]=1;});
    cats=(d.categories||[]).filter(function(c){return used[c.id];});
    render();
  }).catch(function(){failed=true;render();});
})();
</script>
</body>
</html>
