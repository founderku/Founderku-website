<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Founderku</title>
<meta name="description" content="Cerita, update produk, dan studi kasus dari Founderku.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0">
    <div class="hero-top">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 class="h1" data-t="h1" data-dot></h1>
      </div>
      <p data-t="sub"></p>
    </div>
  </section>

  <section class="band flush">
    <div class="filters" id="filters" role="group" data-t-aria="filterAria"></div>
    <div class="news all" id="grid"><div class="state" data-t="loading"></div></div>
  </section>
  <section class="band rv">
    <div class="cta-row">
      <div><h2 class="h2" data-t="ctaH" data-dot></h2><p data-t="ctaP"></p></div>
      <div class="hero-btns" style="margin-top:0"><a class="btn btn-solid wa-link" href="#" data-t="ctaBtn"></a></div>
    </div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  var COVERS={amber:'art-a',coral:'art-b',indigo:'art-c'};
  var PCAT={id:{update:'Update',product:'Produk','case-study':'Studi kasus'},en:{update:'Update',product:'Product','case-study':'Case study'},tr:{update:'Güncelleme',product:'Ürün','case-study':'Vaka çalışması'}};
  function pcat(p){return (PCAT[FK.lang]||PCAT.id)[p.category]||p.category||'';}
  function postCard(p){var title=FK.pick(p.title);return '<a class="post rv" href="/blog-post.html?slug='+encodeURIComponent(p.slug)+'"><div class="cover '+(COVERS[p.coverGradient]||'art-a')+'"><span class="grain"></span><span style="position:relative">'+FK.esc(title.length>40?title.slice(0,38)+'...':title)+'</span></div><b>'+FK.esc(title)+'</b><small>'+FK.esc(pcat(p))+' · '+FK.esc(p.date||'')+'</small></a>';}
  var DICT={
    id:{title:'Blog · Founderku',eyebrow:'Blog',h1:'Cerita dan update dari Founderku.',sub:'Perkembangan produk, studi kasus, dan hal-hal yang lagi kami kerjakan. Ditulis apa adanya, dari balik layar.',filterAria:'Filter kategori',all:'Semua',loading:'Memuat artikel...',empty:'Belum ada artikel.',error:'Gagal memuat artikel. Coba muat ulang halaman.',ctaH:'Punya ide yang mau diwujudkan?',ctaP:'Ngobrol 30 menit, gratis dan tanpa tekanan.',ctaBtn:'Chat di WhatsApp'},
    en:{title:'Blog · Founderku',eyebrow:'Blog',h1:'Stories and updates from Founderku.',sub:'Product progress, case studies, and what we are working on. Written honestly, from behind the scenes.',filterAria:'Filter by category',all:'All',loading:'Loading articles...',empty:'No articles yet.',error:'Could not load the articles. Try reloading the page.',ctaH:'Have an idea you want to build?',ctaP:'A free 30-minute chat, no pressure.',ctaBtn:'Chat on WhatsApp'},
    tr:{title:'Blog · Founderku',eyebrow:'Blog',h1:'Founderku\'dan hikayeler ve güncellemeler.',sub:'Ürün gelişmeleri, vaka çalışmaları ve üzerinde çalıştıklarımız. Perde arkasından, olduğu gibi.',filterAria:'Kategoriye göre filtrele',all:'Tümü',loading:'Yazılar yükleniyor...',empty:'Henüz yazı yok.',error:'Yazılar yüklenemedi. Sayfayı yenilemeyi dene.',ctaH:'Hayata geçirmek istediğin bir fikir mi var?',ctaP:'Ücretsiz 30 dakikalık sohbet, baskı yok.',ctaBtn:'WhatsApp\'tan yaz'}
  };
  var posts=null,active='all',failed=false;
  var grid=document.getElementById('grid'),filters=document.getElementById('filters');
  function render(){
    var get=FK.apply(DICT);
    if(failed){grid.innerHTML='<div class="state">'+FK.esc(get('error'))+'</div>';return;}
    if(!posts) return;
    var cats=[];posts.forEach(function(p){if(p.category&&cats.indexOf(p.category)<0)cats.push(p.category);});
    filters.hidden=cats.length<2;
    filters.innerHTML=['all'].concat(cats).map(function(c){return '<button type="button" data-cat="'+FK.esc(c)+'" aria-pressed="'+(active===c)+'">'+FK.esc(c==='all'?get('all'):pcat({category:c}))+'</button>';}).join('');
    [].forEach.call(filters.children,function(b){b.addEventListener('click',function(){active=b.dataset.cat;render();});});
    var list=active==='all'?posts:posts.filter(function(p){return p.category===active;});
    grid.innerHTML=list.length?list.map(postCard).join(''):'<div class="state">'+FK.esc(get('empty'))+'</div>';
    FK.reveal();
  }
  FK.onLang(render);
  FK.json('/data/blog.json').then(function(d){posts=(d.posts||[]).slice().sort(function(a,b){return (a.order||99)-(b.order||99);});render();}).catch(function(){failed=true;render();});
})();
</script>
</body>
</html>
