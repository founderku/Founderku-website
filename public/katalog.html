<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Program · Founderku</title>
<meta name="description" content="Program dan kesempatan untuk founder dari Founderku.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0">
    <div class="hero-top">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 class="h1" data-t="h1" data-dot></h1>
      </div>
      <p data-t="sub"></p>
    </div>
  </section>

  <section class="band flush">
    <div class="cards" id="grid"><div class="state" data-t="loading"></div></div>
  </section>
  <section class="band rv">
    <div class="cta-row">
      <div><h2 class="h2" data-t="ctaH" data-dot></h2><p data-t="ctaP"></p></div>
      <div class="hero-btns" style="margin-top:0"><a class="btn btn-solid wa-link" href="#" data-t="ctaBtn"></a></div>
    </div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  function card(it,get){
    var ext=it.external?' target="_blank" rel="noopener"':'';
    var logo=it.logo?'<img class="logo-img'+(it.roundLogo?' round':'')+'" src="'+FK.esc(FK.safeUrl(it.logo))+'" alt="" loading="lazy">':'<span class="orb spin o-g'+(it._i%6)+'"><i></i></span>';
    var tags=FK.pickArr(it.tags).slice(0,4).map(function(x){return '<span>'+FK.esc(x)+'</span>';}).join('');
    var href=it.linkUrl?FK.safeUrl(it.linkUrl):'';
    var inner='<div class="top">'+logo+'<div><h3>'+FK.esc(it.name)+'</h3><div class="note">'+FK.esc(FK.pick(it.note))+'</div></div></div>'+
      '<div class="body"><p>'+FK.esc(FK.pick(it.description))+'</p><div class="tags">'+tags+'</div>'+
      (href?'<div class="foot"><span class="go">'+FK.esc(FK.pick(it.linkLabel)||get('go'))+'</span></div>':'')+'</div>';
    return href?'<a class="cd rv" href="'+FK.esc(href)+'"'+ext+'>'+inner+'</a>':'<div class="cd rv">'+inner+'</div>';
  }
  var DICT={
    id:{title:'Katalog Program · Founderku',eyebrow:'Katalog Program',h1:'Program dan kesempatan buat founder.',sub:'Pilih yang cocok buat kamu, lalu daftar langsung dari sini. Daftar ini kami perbarui setiap ada program baru.',loading:'Memuat katalog...',empty:'Belum ada program yang dibuka. Pantau terus halaman ini, atau ngobrol dulu dengan kami.',error:'Gagal memuat katalog. Coba muat ulang halaman.',go:'Daftar sekarang',ctaH:'Mau dikabari kalau ada program baru?',ctaP:'Kirim pesan ke kami, nanti kami kabari lewat WhatsApp.',ctaBtn:'Chat di WhatsApp'},
    en:{title:'Program Catalog · Founderku',eyebrow:'Program Catalog',h1:'Programs and opportunities for founders.',sub:'Pick what suits you and sign up right here. We update this list whenever a new program opens.',loading:'Loading catalog...',empty:'No programs are open right now. Check back soon, or have a chat with us first.',error:'Could not load the catalog. Try reloading the page.',go:'Sign up now',ctaH:'Want to hear when a new program opens?',ctaP:'Send us a message and we will let you know on WhatsApp.',ctaBtn:'Chat on WhatsApp'},
    tr:{title:'Program Kataloğu · Founderku',eyebrow:'Program Kataloğu',h1:'Kurucular için programlar ve fırsatlar.',sub:'Sana uyanı seç ve buradan hemen kaydol. Yeni bir program açıldığında bu listeyi güncelliyoruz.',loading:'Katalog yükleniyor...',empty:'Şu an açık program yok. Yakında tekrar bak ya da önce bizimle konuş.',error:'Katalog yüklenemedi. Sayfayı yenilemeyi dene.',go:'Hemen kaydol',ctaH:'Yeni program açılınca haber almak ister misin?',ctaP:'Bize mesaj gönder, WhatsApp\'tan haber verelim.',ctaBtn:'WhatsApp\'tan yaz'}
  };
  var items=null,failed=false,grid=document.getElementById('grid');
  function render(){
    var get=FK.apply(DICT);
    if(failed){grid.innerHTML='<div class="state">'+FK.esc(get('error'))+'</div>';return;}
    if(!items) return;
    grid.innerHTML=items.length?items.map(function(it){return card(it,get);}).join(''):'<div class="state">'+FK.esc(get('empty'))+'</div>';
    FK.reveal();
  }
  FK.onLang(render);
  FK.json('/data/catalog.json').then(function(d){items=(d.items||[]).slice().sort(function(a,b){return (a.order||99)-(b.order||99);});items.forEach(function(x,i){x._i=i;});render();}).catch(function(){failed=true;render();});
})();
</script>
</body>
</html>
