<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Founderku</title>
<meta name="description" content="Artikel dari blog Founderku.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0;padding-top:clamp(28px,4vw,56px)">
    <article class="article" id="art" hidden>
      <nav class="crumb" aria-label="Breadcrumb"><a href="/blog.html">Blog</a><span aria-hidden="true">/</span><span id="aCat"></span></nav>
      <div class="meta" id="aMeta"></div>
      <h1 id="aTitle"></h1>
      <div class="cover" id="aCover"><span class="grain"></span><span style="position:relative" id="aCoverT"></span></div>
      <div class="content" id="aBody"></div>
      <div class="back"><a class="btn btn-line" href="/blog.html" data-t="back"></a><a class="btn btn-solid wa-link" href="#" data-t="talk"></a></div>
    </article>
    <div class="state" id="nf" hidden><span data-t="nf"></span> <a href="/blog.html" data-t="nfLink"></a></div>
  </section>

  <section class="band rv" id="moreBand" hidden>
    <div class="row-head"><span data-t="more"></span><a class="btn btn-line btn-sm" href="/blog.html" data-t="all"></a></div>
    <div class="news" id="more"></div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  var COVERS={amber:'art-a',coral:'art-b',indigo:'art-c'};
  var PCAT={id:{update:'Update',product:'Produk','case-study':'Studi kasus'},en:{update:'Update',product:'Product','case-study':'Case study'},tr:{update:'Güncelleme',product:'Ürün','case-study':'Vaka çalışması'}};
  function pcat(p){return (PCAT[FK.lang]||PCAT.id)[p.category]||p.category||'';}
  function postCard(p){var title=FK.pick(p.title);return '<a class="post rv" href="/blog-post.html?slug='+encodeURIComponent(p.slug)+'"><div class="cover '+(COVERS[p.coverGradient]||'art-a')+'"><span class="grain"></span><span style="position:relative">'+FK.esc(title.length>40?title.slice(0,38)+'...':title)+'</span></div><b>'+FK.esc(title)+'</b><small>'+FK.esc(pcat(p))+' · '+FK.esc(p.date||'')+'</small></a>';}
  var DICT={
    id:{back:'Semua artikel',talk:'Ngobrol dengan kami',nf:'Artikel ini belum ada atau sudah dipindah.',nfLink:'Balik ke blog',more:'Artikel lain',all:'Semua artikel'},
    en:{back:'All articles',talk:'Talk to us',nf:'This article does not exist or has moved.',nfLink:'Back to the blog',more:'More articles',all:'All articles'},
    tr:{back:'Tüm yazılar',talk:'Bizimle konuş',nf:'Bu yazı yok ya da taşındı.',nfLink:'Bloga dön',more:'Diğer yazılar',all:'Tüm yazılar'}
  };
  var slug=new URLSearchParams(location.search).get('slug'),p=null,all=[],nf=false;
  function render(){
    FK.apply(DICT);
    if(nf){document.getElementById('nf').hidden=false;return;}
    if(!p) return;
    var title=FK.pick(p.title);
    document.title=title+' · Founderku';
    document.getElementById('aCat').textContent=pcat(p);
    document.getElementById('aMeta').textContent=pcat(p)+' · '+(p.date||'');
    document.getElementById('aTitle').textContent=title;
    document.getElementById('aCover').className='cover '+(COVERS[p.coverGradient]||'art-a');
    document.getElementById('aCoverT').textContent=title;
    // Isi artikel selalu teks biasa (bukan HTML), jadi tidak bisa menjalankan kode
    var body=document.getElementById('aBody');body.textContent='';
    (FK.pick(p.content)||FK.pick(p.excerpt)||'').split(/\n+/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(s){var el=document.createElement('p');el.textContent=s;body.appendChild(el);});
    document.getElementById('art').hidden=false;
    var others=all.filter(function(x){return x.slug!==p.slug;}).slice(0,3);
    document.getElementById('moreBand').hidden=!others.length;
    document.getElementById('more').innerHTML=others.map(postCard).join('');
    FK.reveal();
  }
  FK.onLang(render);
  if(!slug){nf=true;render();}
  else FK.json('/data/blog.json').then(function(d){
    all=(d.posts||[]).slice().sort(function(a,b){return (a.order||99)-(b.order||99);});
    p=all.filter(function(x){return x.slug===slug;})[0]||null; if(!p) nf=true; render();
  }).catch(function(){nf=true;render();});
})();
</script>
</body>
</html>
