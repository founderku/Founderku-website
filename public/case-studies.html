<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studi Kasus · Founderku</title>
<meta name="description" content="Project yang sudah selesai dan berjalan bersama Founderku, dari ide sampai online.">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<script>
try{var t=localStorage.getItem('fk-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{var l=localStorage.getItem('fk-lang');if(l==='en'||l==='tr'||l==='id')document.documentElement.setAttribute('lang',l)}catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/fk-site.css">
</head>
<body>
<header class="nav" id="nav" data-fk-nav></header>

<main class="frame">
  <section class="band hero-band" style="border-top:0">
    <div class="hero-top">
      <div>
        <div class="eyebrow" data-t="eyebrow"></div>
        <h1 class="h1" data-t="h1" data-dot></h1>
        <div class="hero-btns"><a class="btn btn-solid wa-link" href="#" data-t="cta1"></a><a class="btn btn-line" href="/store.html" data-t="cta2"></a></div>
      </div>
      <p data-t="sub"></p>
    </div>
  </section>

  <section class="band flush">
    <div class="cards" id="grid"><div class="state" data-t="loading"></div></div>
  </section>
  <section class="band rv">
    <div class="cta-row">
      <div><h2 class="h2" data-t="ctaH" data-dot></h2><p data-t="ctaP"></p></div>
      <div class="hero-btns" style="margin-top:0"><a class="btn btn-solid wa-link" href="#" data-t="ctaBtn"></a></div>
    </div>
  </section>

  <footer class="band" data-fk-foot></footer>
</main>

<script src="/assets/fk-site.js"></script>
<script>
(function(){
  function card(it,get){
    var ext=it.external?' target="_blank" rel="noopener"':'';
    var logo=it.logo?'<img class="logo-img'+(it.roundLogo?' round':'')+'" src="'+FK.esc(FK.safeUrl(it.logo))+'" alt="" loading="lazy">':'<span class="orb spin o-g'+(it._i%6)+'"><i></i></span>';
    var tags=FK.pickArr(it.tags).slice(0,4).map(function(x){return '<span>'+FK.esc(x)+'</span>';}).join('');
    var href=it.linkUrl?FK.safeUrl(it.linkUrl):'';
    var inner='<div class="top">'+logo+'<div><h3>'+FK.esc(it.name)+'</h3><div class="note">'+FK.esc(FK.pick(it.note))+'</div></div></div>'+
      '<div class="body"><p>'+FK.esc(FK.pick(it.description))+'</p><div class="tags">'+tags+'</div>'+
      (href?'<div class="foot"><span class="go">'+FK.esc(FK.pick(it.linkLabel)||get('go'))+'</span></div>':'')+'</div>';
    return href?'<a class="cd rv" href="'+FK.esc(href)+'"'+ext+'>'+inner+'</a>':'<div class="cd rv">'+inner+'</div>';
  }
  var DICT={
    id:{title:'Studi Kasus · Founderku',eyebrow:'Studi Kasus',h1:'Project yang udah kelar dan jalan.',sub:'Bukan mockup. Ini produk yang beneran dipakai, dari ide sampai online, dikerjakan bareng Founderku.',cta1:'Ceritain ide kamu',cta2:'Lihat Starterpack',loading:'Memuat studi kasus...',empty:'Belum ada studi kasus.',error:'Gagal memuat studi kasus. Coba muat ulang halaman.',go:'Lihat project',ctaH:'Project kamu bisa jadi berikutnya.',ctaP:'Rata-rata 4-6 minggu dari ngobrol pertama sampai produk siap didemokan.',ctaBtn:'Chat di WhatsApp'},
    en:{title:'Case Studies · Founderku',eyebrow:'Case Studies',h1:'Projects that shipped and run.',sub:'Not mockups. These are products people actually use, from idea to launch, built with Founderku.',cta1:'Tell us your idea',cta2:'See Starterpack',loading:'Loading case studies...',empty:'No case studies yet.',error:'Could not load the case studies. Try reloading the page.',go:'See the project',ctaH:'Your project could be next.',ctaP:'Usually 4-6 weeks from the first chat to a demo-ready product.',ctaBtn:'Chat on WhatsApp'},
    tr:{title:'Vaka Çalışmaları · Founderku',eyebrow:'Vaka Çalışmaları',h1:'Tamamlanıp yayında olan projeler.',sub:'Maket değil. Fikirden yayına, Founderku ile birlikte yapılmış ve gerçekten kullanılan ürünler.',cta1:'Fikrini anlat',cta2:'Starterpack\'e bak',loading:'Vaka çalışmaları yükleniyor...',empty:'Henüz vaka çalışması yok.',error:'Vaka çalışmaları yüklenemedi. Sayfayı yenilemeyi dene.',go:'Projeyi gör',ctaH:'Sıradaki proje seninki olabilir.',ctaP:'İlk sohbetten demoya hazır ürüne genellikle 4-6 hafta.',ctaBtn:'WhatsApp\'tan yaz'}
  };
  var items=null,failed=false,grid=document.getElementById('grid');
  function render(){
    var get=FK.apply(DICT);
    if(failed){grid.innerHTML='<div class="state">'+FK.esc(get('error'))+'</div>';return;}
    if(!items) return;
    grid.innerHTML=items.length?items.map(function(it){return card(it,get);}).join(''):'<div class="state">'+FK.esc(get('empty'))+'</div>';
    FK.reveal();
  }
  FK.onLang(render);
  FK.json('/data/case-studies.json').then(function(d){items=(d.caseStudies||[]).slice().sort(function(a,b){return (a.order||99)-(b.order||99);});items.forEach(function(x,i){x._i=i;});render();}).catch(function(){failed=true;render();});
})();
</script>
</body>
</html>
